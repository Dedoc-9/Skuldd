# SPDX-License-Identifier: AGPL-3.0-only
# MathKernel on Linux: the thirteen folder gates, each its own job, on GitHub-hosted Ubuntu 24.04, in a container built
# from ci/mathkernel/Dockerfile (OCaml 4.14.2, Coq 8.20.1, Flocq 4.2.1 from opam), --network none; and the
# floating-point state guard's gate on x86-64 and arm64. Each gate is given its folder's anchor from a repository Actions
# variable that the owner sets from the owner's own sha256 of the folder's FROZEN4.txt; a missing or malformed anchor
# fails that job before its gate starts (never a hash taken from this checkout), and a gate whose output does not show
# the anchored row passing fails the job. The anchor binds only when this file and kernel/coq/gate/gate4.py are the
# reviewed ones: both come from the commit being judged. The manifests and feature rows run in integrity.yml, on every
# change. What a green run shows and does not show: docs/engineering/MATHKERNEL-LINUX-CI.md.
name: MathKernel on Linux

on:
  push:
    paths:
      - "kernel/**"
      - "ci/mathkernel/**"
      - ".github/workflows/mathkernel-linux.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "ci/mathkernel/**"
      - ".github/workflows/mathkernel-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathkernel-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  IMAGE: skuldd-mathkernel-ci:local

jobs:
  fpenv:
    name: Floating-point state guard (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: mk_fpenv's self-test, plants and mutants with GCC and clang
        run: |
          set -euo pipefail
          command -v gcc >/dev/null || { echo "REFUSED: gcc is not on this runner" >&2; exit 2; }
          CLANG=$(command -v clang || ls /usr/bin/clang-[0-9]* 2>/dev/null | sort -V | tail -n 1 || true)
          [ -n "$CLANG" ] || { echo "REFUSED: no clang on this runner" >&2; exit 2; }
          echo "compilers: $(command -v gcc) and $CLANG"
          python3 -B kernel/runtime/check_fpenv.py --cc gcc --cc "$CLANG"

  image:
    name: Build the Coq/Flocq image (once per Dockerfile and cache scope)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore the image from GitHub's cache
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/mk-image
          key: mk-image-v2-${{ runner.os }}-${{ hashFiles('ci/mathkernel/Dockerfile') }}
      - name: Build and save the image (only when the cache has none for this Dockerfile in this scope)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker build --pull --progress=plain -f ci/mathkernel/Dockerfile -t "$IMAGE" ci/mathkernel 2>&1 | tee "$RUNNER_TEMP/build.log"
          base=$(grep -oE '^#[0-9]+ \[1/[0-9]+\] FROM [^ ]+@sha256:[0-9a-f]{64}' "$RUNNER_TEMP/build.log" | head -n 1 | sed 's/.* FROM //' || true)
          [ -n "$base" ] || { echo "REFUSED: the build's output names no base image digest" >&2; exit 2; }
          mkdir -p /tmp/mk-image
          printf '%s\n' "$base" > /tmp/mk-image/base-image.txt
          docker save -o /tmp/mk-image/image.tar "$IMAGE"
      - name: Say what the image holds
        run: |
          set -euo pipefail
          [ -s /tmp/mk-image/base-image.txt ] || { echo "REFUSED: the cached image has no recorded base digest" >&2; exit 2; }
          echo "base image: $(cat /tmp/mk-image/base-image.txt)"
          docker load -i /tmp/mk-image/image.tar
          echo "image id: $(docker image inspect "$IMAGE" --format '{{.Id}}')"
          docker run --rm --network none "$IMAGE" sh -c \
            'coqc --version; ocaml -version; python3 --version; opam repo list --all; opam list --installed --columns=name,version; sha256sum /opt/mk-switch.export "$(command -v coqc)" "$(command -v coqchk)" "$(command -v python3)"'

  gate:
    name: Gate ${{ matrix.folder }}
    needs: [image]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { folder: f32, anchor: MK_ANCHOR_F32 }
          - { folder: p32, anchor: MK_ANCHOR_P32 }
          - { folder: p32r, anchor: MK_ANCHOR_P32R }
          - { folder: exp32, anchor: MK_ANCHOR_EXP32 }
          - { folder: exp32r, anchor: MK_ANCHOR_EXP32R }
          - { folder: ieee64, anchor: MK_ANCHOR_IEEE64 }
          - { folder: sin32, anchor: MK_ANCHOR_SIN32 }
          - { folder: cos32, anchor: MK_ANCHOR_COS32 }
          - { folder: sincos32, anchor: MK_ANCHOR_SINCOS32 }
          - { folder: log32, anchor: MK_ANCHOR_LOG32 }
          - { folder: sincos32i, anchor: MK_ANCHOR_SINCOS32I }
          - { folder: sincos32z, anchor: MK_ANCHOR_SINCOS32Z }
          - { folder: compose, anchor: MK_ANCHOR_COMPOSE }
    env:
      FOLDER: ${{ matrix.folder }}
      ANCHOR_NAME: ${{ matrix.anchor }}
      ANCHOR: ${{ vars[matrix.anchor] }}
    steps:
      - name: The anchor is the owner's, set outside this checkout (fail closed)
        run: |
          set -euo pipefail
          if ! LC_ALL=C bash -c '[[ $ANCHOR =~ ^[0-9a-f]{64}$ ]]'; then
            echo "REFUSED: the repository Actions variable $ANCHOR_NAME is missing or is not exactly 64 lower-case hex digits." >&2
            echo "It must hold the owner's own sha256 of kernel/coq/$FOLDER/FROZEN4.txt (docs/engineering/MATHKERNEL-LINUX-CI.md)." >&2
            exit 2
          fi
          echo "anchor $ANCHOR_NAME = ${ANCHOR:0:16}..."
      - uses: actions/checkout@v4
      - name: Load the image built for this run
        uses: actions/cache/restore@v4
        with:
          path: /tmp/mk-image
          key: mk-image-v2-${{ runner.os }}-${{ hashFiles('ci/mathkernel/Dockerfile') }}
          fail-on-cache-miss: true
      - name: Load it and say which it is
        run: |
          set -euo pipefail
          docker load -i /tmp/mk-image/image.tar
          echo "image id: $(docker image inspect "$IMAGE" --format '{{.Id}}')"
      - name: Feature row on the folder's freeze list (the tree read-only)
        run: |
          docker run --rm --network none -e FOLDER -e PYTHONHASHSEED -e PYTHONUTF8 -e PYTHONDONTWRITEBYTECODE \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work "$IMAGE" \
            python3 -B kernel/hardening/features/feature_row3.py kernel/coq --list "kernel/coq/$FOLDER/FROZEN4.txt"
      - name: The folder's gate, with its anchor, every library rechecked
        run: |
          set -euo pipefail
          docker run --rm --network none -e ANCHOR -e PYTHONHASHSEED -e PYTHONUTF8 -e PYTHONDONTWRITEBYTECODE \
            -v "$GITHUB_WORKSPACE/kernel/coq:/work" -w /work "$IMAGE" \
            python3 -B gate/gate4.py "$FOLDER" --recheck | tee "$RUNNER_TEMP/gate.log"
          grep -Eq "^  freeze list is the anchored one +ok  ANCHOR ${ANCHOR:0:16}\$" "$RUNNER_TEMP/gate.log" \
            || { echo "REFUSED: the gate's output does not show the anchored row passing" >&2; exit 2; }
